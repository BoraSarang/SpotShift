# SpotShift 릴리즈: v* 태그 푸시 시 서명 릴리즈 APK 빌드 후 GitHub Release에 첨부.
# 필요 시크릿: KEYSTORE_BASE64 (release.jks base64), KEYSTORE_PASSWORD, KEY_ALIAS
name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "keystore.path=keystore/release.jks"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "keystore.alias=$KEY_ALIAS"
          } > android/local.properties

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
